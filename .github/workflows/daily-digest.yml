name: Digest Discord quotidien

on:
  schedule:
    # Déclenché 2 fois (7h et 8h UTC) pour couvrir 9h Paris été/hiver.
    # Le script vérifie l'heure réelle à Paris et ne fait rien si ce n'est pas 9h.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer le résumé sur Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/send-digest.mjs
